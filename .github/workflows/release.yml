name: Release

# Publishing a GitHub release builds the package and uploads it to PyPI through trusted
# publishing (OIDC); no API token is stored. The PyPI project must list this repository,
# workflow file and the "pypi" environment as a trusted publisher.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,dns,syntax,socks]" build
      - name: Check
        run: |
          ruff check .
          ruff format --check .
          mypy --strict src
          pytest
      - name: Version matches tag
        run: |
          version=$(python -c "import prebounce; print(prebounce.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}"
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prebounce
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}"
